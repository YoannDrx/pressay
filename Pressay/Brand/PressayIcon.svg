<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Pressay app icon</title>
  <desc id="description">A cyan and indigo P crossed by a voice waveform on a navy rounded key.</desc>
  <defs>
    <linearGradient id="key" x1="96" y1="56" x2="928" y2="968" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101A44"/>
      <stop offset="1" stop-color="#0B1028"/>
    </linearGradient>
    <linearGradient id="brand" x1="250" y1="220" x2="790" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#44D8FF"/>
      <stop offset=".55" stop-color="#5668FF"/>
      <stop offset="1" stop-color="#B86BFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#020615" flood-opacity=".55"/>
    </filter>
    <clipPath id="safe">
      <rect x="56" y="56" width="912" height="912" rx="212"/>
    </clipPath>
    <path id="letter-p" fill-rule="evenodd" d="
      M278 794V230h276c168 0 274 92 274 239
      0 151-110 247-280 247h-96v78H278Zm174-422v202h92
      c69 0 110-38 110-103 0-63-41-99-110-99h-92Z"/>
    <clipPath id="letter-p-clip">
      <use href="#letter-p"/>
    </clipPath>
    <g id="waveform">
      <rect x="154" y="491" width="22" height="42" rx="11"/>
      <rect x="190" y="472" width="24" height="80" rx="12"/>
      <rect x="230" y="451" width="26" height="122" rx="13"/>
      <rect x="272" y="423" width="28" height="178" rx="14"/>
      <rect x="316" y="462" width="28" height="100" rx="14"/>
      <rect x="360" y="398" width="30" height="228" rx="15"/>
      <rect x="406" y="448" width="30" height="128" rx="15"/>
      <rect x="452" y="371" width="32" height="282" rx="16"/>
      <rect x="500" y="336" width="34" height="352" rx="17"/>
      <rect x="550" y="387" width="32" height="250" rx="16"/>
      <rect x="598" y="438" width="30" height="148" rx="15"/>
      <rect x="644" y="466" width="28" height="92" rx="14"/>
      <rect x="688" y="418" width="28" height="188" rx="14"/>
      <rect x="732" y="453" width="26" height="118" rx="13"/>
      <rect x="774" y="429" width="28" height="166" rx="14"/>
      <rect x="818" y="459" width="26" height="106" rx="13"/>
      <rect x="860" y="482" width="24" height="60" rx="12"/>
    </g>
  </defs>

  <g clip-path="url(#safe)">
    <rect x="56" y="56" width="912" height="912" rx="212" fill="url(#key)"/>
    <rect x="74" y="74" width="876" height="876" rx="194" fill="none" stroke="#263568" stroke-width="18"/>

    <g filter="url(#shadow)">
      <use href="#letter-p" fill="url(#brand)"/>
    </g>
    <use href="#waveform" fill="url(#brand)"/>
    <use href="#waveform" fill="#0B1028" clip-path="url(#letter-p-clip)"/>
  </g>
</svg>
