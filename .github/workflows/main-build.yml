name: "Pressay Apple Silicon Build"

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: pressay-main-arm64
      - run: bun install --frozen-lockfile
      - name: Build unsigned Apple Silicon app
        run: bun tauri build --target aarch64-apple-darwin --bundles app
      - uses: actions/upload-artifact@v7
        with:
          name: pressay-main-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Pressay.app
          retention-days: 14
