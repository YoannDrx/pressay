name: "Pressay Manual Build Test"

on: workflow_dispatch

jobs:
  build-test:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      platform: "macos-26"
      target: "aarch64-apple-darwin"
      build-args: "--target aarch64-apple-darwin --bundles app"
      sign-binaries: false
      asset-prefix: "pressay-test"
      upload-artifacts: true
