name: "Pressay DMG Release"

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  native-checks:
    uses: ./.github/workflows/macos-tests.yml
  create-release:
    needs: native-checks
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.version.outputs.version }}
      features: ${{ steps.version.outputs.features }}
      environment: ${{ steps.version.outputs.environment }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Refuse releases outside merged main
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin main

          if [[ "${GITHUB_REF_TYPE:-}" == "branch" ]]; then
            test "$GITHUB_REF" = "refs/heads/main"
            test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
          else
            echo "Unsupported release ref type: ${GITHUB_REF_TYPE:-missing}" >&2
            exit 1
          fi

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version=$(jq -r '.version' src-tauri/tauri.conf.json)
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "features=updater" >> "$GITHUB_OUTPUT"
            echo "environment=staging-direct" >> "$GITHUB_OUTPUT"
          else
            echo "features=updater,commercial-entitlements" >> "$GITHUB_OUTPUT"
            echo "environment=production-direct" >> "$GITHUB_OUTPUT"
          fi
          package_version=$(jq -r '.version' package.json)
          cargo_version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml)
          test "$version" = "$package_version"
          test "$version" = "$cargo_version"

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const tag = `v${{ steps.version.outputs.version }}`;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Pressay ${tag}`,
              draft: true,
              prerelease: tag.includes('-'),
              generate_release_notes: true
            });
            return data.id;

  build-dmg:
    needs: create-release
    uses: ./.github/workflows/build.yml
    with:
      platform: "macos-26"
      target: "aarch64-apple-darwin"
      build-args: "--target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.updater.conf.json --features ${{ needs.create-release.outputs.features }}"
      build-environment: ${{ needs.create-release.outputs.environment }}
      sign-binaries: true
      asset-prefix: "pressay"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      no-cache: true
    secrets: inherit

  verify-updater-assets:
    needs: [create-release, build-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - name: Check the draft contains a signed macOS updater
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          mkdir -p release-check
          gh release download "v$RELEASE_VERSION" --pattern latest.json --dir release-check
          bun scripts/check-updater-manifest.ts release-check/latest.json "$RELEASE_VERSION"

  verify-published-assets:
    name: Verify downloaded release assets
    needs:
      - create-release
      - build-dmg
      - verify-updater-assets
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
      RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - name: Download the exact GitHub assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets

          download_asset() {
            local asset_name="$1"
            local asset_id
            asset_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
              --jq ".[] | select(.name == \"${asset_name}\") | .id")"
            if [ -z "$asset_id" ]; then
              echo "Missing release asset: ${asset_name}" >&2
              exit 1
            fi
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "release-assets/${asset_name}"
          }

          download_asset Pressay.dmg
          download_asset Pressay.dmg.sha256

      - name: Verify checksum, Gatekeeper, signing and stapling
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shasum -a 256 -c Pressay.dmg.sha256
          xcrun stapler validate Pressay.dmg
          spctl -a -vv -t install Pressay.dmg

          MOUNT_DIR="$(mktemp -d)"
          cleanup_mount() {
            if mount | grep -Fq "on $MOUNT_DIR "; then
              hdiutil detach "$MOUNT_DIR" >/dev/null
            fi
            rmdir "$MOUNT_DIR" 2>/dev/null || true
          }
          trap cleanup_mount EXIT

          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_DIR" Pressay.dmg >/dev/null
          APP_PATH="$(find "$MOUNT_DIR" -maxdepth 2 -name '*.app' -type d -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No application bundle found inside the downloaded DMG" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl -a -vv "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          hdiutil detach "$MOUNT_DIR" >/dev/null

      - name: Publish the verified draft
        shell: bash
        run: |
          set -euo pipefail
          prerelease=false
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease=true
          fi
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease="$prerelease" \
            >/dev/null
