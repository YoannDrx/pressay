name: "Pressay DMG Release"

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  native-checks:
    uses: ./.github/workflows/macos-tests.yml
  create-release:
    needs: native-checks
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.version.outputs.version }}
      features: ${{ steps.version.outputs.features }}
      environment: ${{ steps.version.outputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version=$(jq -r '.version' src-tauri/tauri.conf.json)
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "features=updater" >> "$GITHUB_OUTPUT"
            echo "environment=staging-direct" >> "$GITHUB_OUTPUT"
          else
            echo "features=updater,commercial-entitlements" >> "$GITHUB_OUTPUT"
            echo "environment=production-direct" >> "$GITHUB_OUTPUT"
          fi
          package_version=$(jq -r '.version' package.json)
          cargo_version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml)
          test "$version" = "$package_version"
          test "$version" = "$cargo_version"

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const tag = `v${{ steps.version.outputs.version }}`;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Pressay ${tag}`,
              draft: true,
              prerelease: tag.includes('-'),
              generate_release_notes: true
            });
            return data.id;

  build-dmg:
    needs: create-release
    uses: ./.github/workflows/build.yml
    with:
      platform: "macos-26"
      target: "aarch64-apple-darwin"
      build-args: "--target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.updater.conf.json --features ${{ needs.create-release.outputs.features }}"
      build-environment: ${{ needs.create-release.outputs.environment }}
      sign-binaries: true
      asset-prefix: "pressay"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      no-cache: true
    secrets: inherit

  verify-updater-assets:
    needs: [create-release, build-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - name: Check the draft contains a signed macOS updater
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          mkdir -p release-check
          gh release download "v$RELEASE_VERSION" --pattern latest.json --dir release-check
          bun scripts/check-updater-manifest.ts release-check/latest.json "$RELEASE_VERSION"
