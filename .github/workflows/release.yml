name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pressay-release
  cancel-in-progress: false

jobs:
  verify:
    name: Tests et validation
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Lire le dernier build publié
        run: |
          current_appcast="$RUNNER_TEMP/appcast.xml"
          curl --fail --silent --show-error \
            https://yoanndrx.github.io/pressay/appcast.xml \
            --output "$current_appcast" || : > "$current_appcast"
          last_build="$(
            python3 scripts/latest-appcast-build.py "$current_appcast"
          )"
          echo "LAST_PUBLISHED_BUILD=$last_build" >> "$GITHUB_ENV"
      - name: Valider le tag, la version et le build
        run: scripts/validate-release.sh
      - name: Tests
        run: >-
          xcodebuild test
          -project Pressay.xcodeproj
          -scheme Pressay
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
      - name: Construire la fixture AX universelle
        run: >-
          xcodebuild build
          -project Pressay.xcodeproj
          -target PressayAXFixture
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          ONLY_ACTIVE_ARCH=NO
      - name: Valider les appcasts
        run: |
          python3 scripts/test-latest-appcast-build.py
          python3 scripts/test-merge-appcast.py
      - name: Analyse statique
        run: >-
          xcodebuild analyze
          -project Pressay.xcodeproj
          -scheme Pressay
          -configuration Release
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

  publish:
    name: Signer, notariser et publier
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Vérifier la configuration de publication
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          missing=()
          for name in \
            DEVELOPER_ID_APPLICATION APPLE_TEAM_ID APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD SPARKLE_PRIVATE_KEY \
            BUILD_CERTIFICATE_BASE64 P12_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "Configuration de release incomplète: ${missing[*]}" >&2
            exit 1
          fi

      - name: Importer le certificat Developer ID
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/pressay-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

      - name: Télécharger les outils Sparkle 2.9.2
        run: |
          mkdir -p "$RUNNER_TEMP/sparkle"
          gh release download 2.9.2 \
            --repo sparkle-project/Sparkle \
            --pattern 'Sparkle-2.9.2.tar.xz' \
            --dir "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle/Sparkle-2.9.2.tar.xz" -C "$RUNNER_TEMP/sparkle"
          echo "SPARKLE_GENERATE_APPCAST=$RUNNER_TEMP/sparkle/bin/generate_appcast" >> "$GITHUB_ENV"

      - name: Fabriquer, notariser et contrôler la release
        run: scripts/notarize.sh

      - name: Publier la GitHub Release
        run: |
          prerelease_args=()
          release_notes_args=(--generate-notes)
          if [[ "$GITHUB_REF_NAME" == *"-beta."* || "$GITHUB_REF_NAME" == *"-rc."* ]]; then
            prerelease_args+=(--prerelease)
          fi
          release_notes_file="release-notes/$GITHUB_REF_NAME.md"
          if [[ -f "$release_notes_file" ]]; then
            release_notes_args=(--notes-file "$release_notes_file")
          fi
          gh release create "$GITHUB_REF_NAME" \
            build/release/Pressay.dmg \
            build/release/Pressay.dmg.sha256 \
            build/release/appcast.xml \
            --verify-tag \
            --title "Pressay $GITHUB_REF_NAME" \
            "${release_notes_args[@]}" \
            "${prerelease_args[@]}"

      - name: Publier l’appcast sur GitHub Pages
        run: |
          appcast_path="appcast.xml"
          if ! gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/gh-pages" \
            >/dev/null 2>&1
          then
            pages_worktree="$RUNNER_TEMP/pressay-pages"
            git worktree add --detach "$pages_worktree"
            git -C "$pages_worktree" switch --orphan gh-pages
            git -C "$pages_worktree" rm -rf .
            cp build/release/appcast.xml "$pages_worktree/$appcast_path"
            touch "$pages_worktree/.nojekyll"
            git -C "$pages_worktree" add "$appcast_path" .nojekyll
            git -C "$pages_worktree" \
              -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Publier l’appcast $GITHUB_REF_NAME"
            git -C "$pages_worktree" push origin HEAD:gh-pages
            exit 0
          fi
          encoded="$(base64 < build/release/appcast.xml | tr -d '\n')"
          existing_sha="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/contents/$appcast_path?ref=gh-pages" \
              --jq '.sha' 2>/dev/null || true
          )"
          args=(
            --method PUT
            "repos/$GITHUB_REPOSITORY/contents/$appcast_path"
            -f message="Publier l’appcast $GITHUB_REF_NAME"
            -f content="$encoded"
            -f branch="gh-pages"
          )
          if [[ -n "$existing_sha" ]]; then
            args+=(-f sha="$existing_sha")
          fi
          gh api "${args[@]}"

      - name: Vérifier l’appcast public
        run: >-
          python3 scripts/verify-public-appcast.py
          https://yoanndrx.github.io/pressay/appcast.xml
          "${GITHUB_REF_NAME#v}"
          "$(xcodebuild -project Pressay.xcodeproj -scheme Pressay
          -configuration Release -showBuildSettings
          | awk -F ' = ' '/^[[:space:]]*CURRENT_PROJECT_VERSION = / { print $2; exit }')"

      - name: Supprimer le Keychain temporaire
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/pressay-signing.keychain-db" || true
