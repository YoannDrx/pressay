name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Tests
        run: >-
          xcodebuild test
          -project Pressay.xcodeproj
          -scheme Pressay
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
      - name: Construire la fixture AX universelle
        run: >-
          xcodebuild build
          -project Pressay.xcodeproj
          -target PressayAXFixture
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          ONLY_ACTIVE_ARCH=NO
      - name: Analyse statique
        run: >-
          xcodebuild analyze
          -project Pressay.xcodeproj
          -scheme Pressay
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
      - name: Valider la cible Mac App Store
        run: scripts/validate-app-store.sh
      - name: Valider les scripts de publication
        run: zsh -n scripts/archive-app-store.sh scripts/validate-app-store.sh
      - name: Valider les appcasts
        run: |
          python3 scripts/test-latest-appcast-build.py
          python3 scripts/test-merge-appcast.py
