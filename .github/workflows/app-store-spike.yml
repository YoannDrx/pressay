name: "Pressay Mac App Store Spike"

on: workflow_dispatch

concurrency:
  group: pressay-app-store-spike
  cancel-in-progress: true

jobs:
  sandbox-build:
    runs-on: macos-26
    permissions:
      contents: read
    env:
      VITE_DISTRIBUTION_CHANNEL: app-store
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: pressay-app-store-spike
      - run: bun install --frozen-lockfile
      - name: Build sandboxed app bundle
        run: >-
          bun run tauri build
          --config src-tauri/tauri.appstore.conf.json
          --target aarch64-apple-darwin
          --bundles app
      - name: Inspect sandbox and private API entitlements
        shell: bash
        run: |
          app=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name '*.app' -type d -print -quit)
          test -n "$app"
          codesign -d --entitlements :- "$app" > entitlements.plist 2>/dev/null
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' entitlements.plist | grep -qx true
          if grep -R "macos-private-api" "$app/Contents"; then
            echo "Private API marker found in App Store bundle" >&2
            exit 1
          fi
      - name: Block Store submission while NSPanel private API is linked
        shell: bash
        run: |
          if grep -Eq 'macos-private-api|tauri-nspanel' src-tauri/Cargo.toml; then
            echo "Store blocker: the current overlay still links private NSPanel support" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: pressay-app-store-spike-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          retention-days: 14
