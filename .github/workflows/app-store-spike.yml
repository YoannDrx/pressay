name: "Pressay Mac App Store Spike"

on: workflow_dispatch

concurrency:
  group: pressay-app-store-spike
  cancel-in-progress: true

jobs:
  sandbox-build:
    runs-on: macos-26
    permissions:
      contents: read
    env:
      VITE_DISTRIBUTION_CHANNEL: app-store
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: pressay-app-store-spike
      - run: bun install --frozen-lockfile
      - name: Validate StoreKit catalogue
        run: bun run storekit:validate
      - name: Build sandboxed app bundle
        run: >-
          bun run tauri build
          --config src-tauri/tauri.appstore.conf.json
          --target aarch64-apple-darwin
          --features mas
          --bundles app
      - name: Inspect sandbox and private API entitlements
        shell: bash
        run: |
          app=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name '*.app' -type d -print -quit)
          test -n "$app"
          # The feasibility job intentionally has no distribution certificate. Ad-hoc
          # signing preserves the sandbox entitlements so CI can inspect the bundle;
          # the archive workflow uses the real Apple Distribution identity.
          codesign --force --deep --sign - \
            --entitlements src-tauri/Entitlements.AppStore.plist "$app"
          codesign -d --entitlements :- "$app" > entitlements.plist 2>/dev/null
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' entitlements.plist | grep -qx true
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' entitlements.plist | grep -qx true
          /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' \
            "$app/Contents/Info.plist" | grep -qx true
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.microphone' entitlements.plist >/dev/null 2>&1; then
            echo "Unknown microphone entitlement found; MAS uses audio-input" >&2
            exit 1
          fi
          if grep -R "macos-private-api" "$app/Contents"; then
            echo "Private API marker found in App Store bundle" >&2
            exit 1
          fi
      - name: Reject private API features in the Store dependency graph
        shell: bash
        run: |
          graph=$(cd src-tauri && cargo tree -e features --no-default-features --features mas)
          if grep -Eq 'tauri feature "macos-private-api"|tauri-nspanel' <<<"$graph"; then
            echo "Store blocker: private NSPanel support entered the MAS feature graph" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: pressay-app-store-spike-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          retention-days: 14
