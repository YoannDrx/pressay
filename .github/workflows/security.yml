name: "security"

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - name: Audit JavaScript dependencies
        run: bun audit --json
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Audit Rust dependencies
        working-directory: src-tauri
        # rust_decimal declares vulnerable rkyv 0.7 as an optional dependency,
        # but no enabled Pressay feature selects it (`cargo tree -i rkyv` is
        # empty). Keep this narrow exception visible until its upstream moves.
        #
        # RUSTSEC-2026-0367/0368/0369: zip 4.6 extraction of symlinks and
        # SUID bits, pulled by tauri-plugin-updater 2.10 only to unpack `.zip`
        # updates. Pressay ships `.app.tar.gz` and NSIS installers, both
        # minisign-verified before use. The fixed plugin (2.14, zip 9) needs
        # Tauri 2.12; drop these exceptions with that upgrade.
        run: >-
          cargo audit
          --ignore RUSTSEC-2026-0235
          --ignore RUSTSEC-2026-0367
          --ignore RUSTSEC-2026-0368
          --ignore RUSTSEC-2026-0369

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
