name: "Pressay Windows Build"

# Unsigned Windows installers for every pull request that touches the app, so
# the Windows code paths are compiled, packaged and smoke-tested continuously.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build.yml"
      - ".github/workflows/windows-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: "--bundles nsis --config src-tauri/tauri.updater.conf.json --features updater"
          - platform: "windows-11-arm"
            target: "aarch64-pc-windows-msvc"
            args: "--target aarch64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.updater.conf.json --features updater"
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      build-environment: "staging-direct"
      sign-binaries: false
      asset-prefix: "pressay-windows-${{ github.event.pull_request.number || github.run_number }}"
      upload-artifacts: true
      run-rust-tests: true
    secrets: inherit
