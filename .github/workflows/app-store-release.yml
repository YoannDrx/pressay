name: "Pressay Mac App Store Archive"

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Validate and upload the signed package to App Store Connect"
        required: true
        type: boolean
        default: false

run-name: >-
  MAS archive ${{ github.sha }}${{ inputs.upload && ' + TestFlight upload' || '' }}

concurrency:
  group: pressay-app-store-release
  cancel-in-progress: false

jobs:
  archive:
    runs-on: macos-26
    environment: app-store-production
    permissions:
      contents: read
    env:
      VITE_DISTRIBUTION_CHANNEL: app-store
    steps:
      - uses: actions/checkout@v5

      - name: Refuse non-main or dirty release sources
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: pressay-app-store-release

      - run: bun install --frozen-lockfile

      - name: Validate StoreKit catalogue
        run: bun run storekit:validate

      - name: Require the protected signing material
        shell: bash
        env:
          MAS_APP_CERTIFICATE_BASE64: ${{ secrets.MAS_APP_CERTIFICATE_BASE64 }}
          MAS_APP_CERTIFICATE_PASSWORD: ${{ secrets.MAS_APP_CERTIFICATE_PASSWORD }}
          MAS_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAS_INSTALLER_CERTIFICATE_BASE64 }}
          MAS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAS_INSTALLER_CERTIFICATE_PASSWORD }}
          MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          required=(
            MAS_APP_CERTIFICATE_BASE64
            MAS_APP_CERTIFICATE_PASSWORD
            MAS_INSTALLER_CERTIFICATE_BASE64
            MAS_INSTALLER_CERTIFICATE_PASSWORD
            MAS_PROVISIONING_PROFILE_BASE64
          )
          if [[ "${{ inputs.upload }}" == "true" ]]; then
            required+=(
              APP_STORE_CONNECT_API_KEY_BASE64
              APP_STORE_CONNECT_KEY_ID
              APP_STORE_CONNECT_ISSUER_ID
            )
          fi
          for name in "${required[@]}"; do
            test -n "${!name:-}" || {
              echo "Missing protected secret: $name" >&2
              exit 1
            }
          done

      - name: Import App Store identities into an ephemeral keychain
        id: signing
        shell: bash
        env:
          MAS_APP_CERTIFICATE_BASE64: ${{ secrets.MAS_APP_CERTIFICATE_BASE64 }}
          MAS_APP_CERTIFICATE_PASSWORD: ${{ secrets.MAS_APP_CERTIFICATE_PASSWORD }}
          MAS_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAS_INSTALLER_CERTIFICATE_BASE64 }}
          MAS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAS_INSTALLER_CERTIFICATE_PASSWORD }}
          MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/pressay-mas.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          app_certificate="$RUNNER_TEMP/pressay-mas-application.p12"
          installer_certificate="$RUNNER_TEMP/pressay-mas-installer.p12"
          profile="$RUNNER_TEMP/Pressay_Mac_App_Store.provisionprofile"

          printf '%s' "$MAS_APP_CERTIFICATE_BASE64" | base64 --decode > "$app_certificate"
          printf '%s' "$MAS_INSTALLER_CERTIFICATE_BASE64" | base64 --decode > "$installer_certificate"
          printf '%s' "$MAS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$app_certificate" -k "$keychain" \
            -P "$MAS_APP_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security import "$installer_certificate" -k "$keychain" \
            -P "$MAS_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

          app_identity=$(security find-identity -v -p codesigning "$keychain" |
            sed -nE 's/^.*"(3rd Party Mac Developer Application:[^"]+)".*$/\1/p' |
            head -n 1)
          installer_identity=$(security find-identity -v -p basic "$keychain" |
            sed -nE 's/^.*"(3rd Party Mac Developer Installer:[^"]+)".*$/\1/p' |
            head -n 1)
          test -n "$app_identity"
          test -n "$installer_identity"

          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "app_identity=$app_identity" >> "$GITHUB_OUTPUT"
          echo "installer_identity=$installer_identity" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      - name: Build the public MAS feature graph
        shell: bash
        run: |
          set -euo pipefail
          bun run tauri build \
            --config src-tauri/tauri.appstore.conf.json \
            --target aarch64-apple-darwin \
            --features mas \
            --bundles app

      - name: Reject private, updater and Direct-payment code paths
        shell: bash
        run: |
          set -euo pipefail
          graph=$(cd src-tauri && cargo tree -e features --no-default-features --features mas)
          if grep -Eq 'tauri feature "macos-private-api"|tauri-nspanel|tauri-plugin-updater|(^| )stripe v' <<<"$graph"; then
            echo "A Direct-only dependency entered the Mac App Store graph" >&2
            exit 1
          fi

          app=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos \
            -name '*.app' -type d -print -quit)
          test -n "$app"
          if rg -a -i 'checkout\.stripe\.com|/v1/billing/checkout|tauri-plugin-updater|macos-private-api' "$app/Contents"; then
            echo "A forbidden Direct-distribution marker entered the Mac App Store bundle" >&2
            exit 1
          fi

      - name: Embed the profile and sign the app
        id: package
        shell: bash
        env:
          APP_IDENTITY: ${{ steps.signing.outputs.app_identity }}
          INSTALLER_IDENTITY: ${{ steps.signing.outputs.installer_identity }}
          PROFILE_PATH: ${{ steps.signing.outputs.profile }}
        run: |
          set -euo pipefail
          app=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos \
            -name '*.app' -type d -print -quit)
          test -n "$app"
          cp "$PROFILE_PATH" "$app/Contents/embedded.provisionprofile"

          codesign --force --deep --timestamp \
            --sign "$APP_IDENTITY" \
            --entitlements src-tauri/Entitlements.AppStore.plist \
            "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          signed_entitlements="$RUNNER_TEMP/pressay-mas-entitlements.plist"
          codesign -d --entitlements :- "$app" > "$signed_entitlements" 2>/dev/null
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' \
            "$signed_entitlements" | grep -qx true
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' \
            "$signed_entitlements" | grep -qx true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "$app/Contents/Info.plist" | grep -qx 'fr.yodev.pressay'
          /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' \
            "$app/Contents/Info.plist" | grep -qx true

          profile_plist="$RUNNER_TEMP/pressay-mas-profile.plist"
          security cms -D -i "$app/Contents/embedded.provisionprofile" > "$profile_plist"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' \
            "$profile_plist" | grep -qx 'G9WFV7HNV6.fr.yodev.pressay'

          package="$RUNNER_TEMP/Pressay-Mac-App-Store.pkg"
          productbuild --component "$app" /Applications \
            --sign "$INSTALLER_IDENTITY" "$package"
          pkgutil --check-signature "$package"
          shasum -a 256 "$package" > "$package.sha256"

          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Prepare App Store Connect API key
        if: inputs.upload
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          key_directory="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_directory"
          chmod 700 "$HOME/.appstoreconnect" "$key_directory"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode \
            > "$key_directory/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$key_directory/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Validate and upload to App Store Connect
        if: inputs.upload
        shell: bash
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.package }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --validate-app \
            -f "$PACKAGE_PATH" -t macos \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          xcrun altool --upload-app \
            -f "$PACKAGE_PATH" -t macos \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload immutable archive evidence
        uses: actions/upload-artifact@v7
        with:
          name: pressay-mas-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.package }}
            ${{ steps.package.outputs.package }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove ephemeral signing material
        if: always()
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set +e
          key_file="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          test -f "$key_file" && rm -f "$key_file"
          test -n "$KEYCHAIN_PATH" && security delete-keychain "$KEYCHAIN_PATH"
          rm -f \
            "$RUNNER_TEMP/pressay-mas-application.p12" \
            "$RUNNER_TEMP/pressay-mas-installer.p12" \
            "$RUNNER_TEMP/Pressay_Mac_App_Store.provisionprofile" \
            "$RUNNER_TEMP/pressay-mas-entitlements.plist" \
            "$RUNNER_TEMP/pressay-mas-profile.plist"
