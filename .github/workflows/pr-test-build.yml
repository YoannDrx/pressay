name: "Pressay PR Test Build"

on: pull_request

jobs:
  build-test:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: pressay-pr-arm64
      - run: bun install --frozen-lockfile
      - name: Build unsigned Apple Silicon app
        run: >-
          bun tauri build
          --target aarch64-apple-darwin
          --bundles app
      - uses: actions/upload-artifact@v7
        with:
          name: pressay-pr-${{ github.event.pull_request.number }}-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Pressay.app
          retention-days: 14

  comment-on-pr:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post artifact links to PR
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Pressay test build\n\nThe unsigned Apple Silicon artifact is available in [this workflow run](${runUrl}).`
            });
