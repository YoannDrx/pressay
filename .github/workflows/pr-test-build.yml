name: "Pressay PR Test Build"

on: pull_request

jobs:
  build-test:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      platform: "macos-26"
      target: "aarch64-apple-darwin"
      build-args: "--target aarch64-apple-darwin --bundles app"
      sign-binaries: false
      asset-prefix: "pressay-pr-${{ github.event.pull_request.number }}"
      upload-artifacts: true
      ref: ${{ github.event.pull_request.head.sha }}

  comment-on-pr:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post artifact links to PR
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Pressay test build\n\nThe unsigned Apple Silicon artifact is available in [this workflow run](${runUrl}).`
            });
